<!DOCTYPE html>
<html lang="pl" data-mode="overlay" data-style="card" data-pos="bl" data-viz="1">
<head>
<meta charset="utf-8">
<title>Pulsar → OBS</title>
<!--
  Pulsar → OBS
  Źródło „Przeglądarka” w OBS (zaznacz „Plik lokalny” i „Steruj dźwiękiem przez OBS”).
  Strona łączy się z działającym Pulsarem (lokalny serwer Neutralino, tylko 127.0.0.1),
  odbiera dźwięk (PCM 16-bit, bez kompresji) i metadane, a OBS przechwytuje ten dźwięk natywnie.
  Plik generuje Pulsar przy włączeniu „Połączenia z OBS” — nie edytuj go ręcznie.
  Strona dostaje wyłącznie „connect token”: może odbierać zdarzenia, ale nie wywoła żadnych funkcji systemowych.
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: #fff; --acc: 160, 107, 255; --m: 24px; --bga: 1; --s: 1; }
  html[data-font="condensed"] body { font-family: "Bahnschrift SemiCondensed", Bahnschrift, "Arial Narrow", "Roboto Condensed", sans-serif; }
  html[data-font="serif"] body { font-family: Georgia, Cambria, "Times New Roman", serif; }
  html[data-font="mono"] body { font-family: "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Courier New", monospace; }
  html[data-font="mono"] .title { letter-spacing: -.02em; }
  html[data-mode="audio"] .card { display: none !important; }
  .card {
    position: absolute; left: var(--m); bottom: var(--m); width: min(720px, calc(100vw - 2 * var(--m))); zoom: var(--s);
    display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center;
    padding: 16px 20px 16px 16px; border-radius: 20px; box-sizing: border-box;
    background: linear-gradient(135deg, rgba(12, 12, 20, calc(.82 * var(--bga))), rgba(12, 12, 20, calc(.64 * var(--bga))));
    border: 1px solid rgba(var(--acc), calc(.45 * var(--bga) + .1));
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 40px rgba(var(--acc), .18) inset;
    --tx: 0px; --ty: 14px; --sc: 1;
    opacity: 0; transform: translate(var(--tx), var(--ty)) scale(var(--sc)); transition: opacity .6s ease, transform .6s ease, border-color .8s ease;
  }
  .card.show { opacity: 1; transform: translate(var(--tx), 0) scale(1); }
  .card.idle, .card.show.ah { opacity: .0; transform: translate(var(--tx), var(--ty)) scale(var(--sc)); }
  /* animacja pojawiania się */
  html[data-anim="fade"] .card { --ty: 0px !important; }
  html[data-anim="zoom"] .card { --ty: 0px !important; --sc: .82; transition-timing-function: cubic-bezier(.2, .9, .3, 1.25); }
  html[data-anim="none"] .card { transition: none; }
  .cw { position: relative; line-height: 0; flex: none; }
  /* rozmyta okładka w tle */
  .bgart { display: none; position: absolute; inset: -30px; z-index: -1; background: center / cover no-repeat; filter: blur(26px) saturate(1.3) brightness(.55); opacity: var(--bga); }
  html[data-art="1"] .card { isolation: isolate; overflow: hidden; }
  html[data-art="1"] .bgart { display: block; }
  /* przewijanie długiego tytułu */
  .title.mq { text-overflow: clip; -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 92%, transparent); }
  .title .mq-in { display: inline-block; padding-left: 4%; animation: pulsarMq var(--mqd, 12s) linear infinite; }
  @keyframes pulsarMq { 0%, 12% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  /* elementy do ukrycia */
  html[data-cover="0"] .cw { display: none; }
  html[data-cover="0"] .card { grid-template-columns: 1fr; }
  html[data-cover="0"] canvas.viz { left: 0; width: 100%; border-radius: 0 0 20px 20px; }
  html[data-prog="0"] .row { display: none !important; }
  html[data-label="0"] .np { display: none !important; }
  .cover { width: 112px; height: 112px; border-radius: 14px; object-fit: cover; background: #151520; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
  .cover:not([src]) { background: radial-gradient(circle at 30% 25%, rgba(var(--acc), .85), rgba(var(--acc), .15) 70%), #151520; }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .np { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; color: rgba(var(--acc), 1); font-weight: 700; filter: brightness(1.35); }
  .title { font-size: 26px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
  .artist { font-size: 17px; color: rgba(255, 255, 255, .72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .bar { flex: 1; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .16); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, rgba(var(--acc), 1), rgba(var(--acc), .6)); box-shadow: 0 0 12px rgba(var(--acc), .8); }
  .time { font-size: 13px; color: rgba(255, 255, 255, .6); font-variant-numeric: tabular-nums; white-space: nowrap; }
  canvas.viz { position: absolute; left: 146px; right: 0; bottom: 0; width: calc(100% - 146px); height: 34px; opacity: .55; pointer-events: none; border-radius: 0 0 20px 0; }

  /* ---------- pozycja (Pulsar → Ustawienia → OBS → Wygląd overlayu) ---------- */
  html[data-pos="br"] .card { left: auto; right: var(--m); }
  html[data-pos="tl"] .card { bottom: auto; top: var(--m); --ty: -14px; }
  html[data-pos="tr"] .card { bottom: auto; top: var(--m); left: auto; right: var(--m); --ty: -14px; }
  html[data-pos="bc"] .card { left: 50%; --tx: -50%; }
  html[data-viz="0"] canvas.viz { display: none; }

  /* ---------- motyw: pasek na całą szerokość ---------- */
  html[data-style="bar"] .card {
    left: 0; right: 0; bottom: 0; top: auto; width: 100%; --tx: 0px; --ty: 100%;
    grid-template-columns: auto 1fr; gap: 14px; padding: 10px 150px 13px 12px; border-radius: 0;
    border-width: 1px 0 0; background: linear-gradient(90deg, rgba(12, 12, 20, calc(.9 * var(--bga))), rgba(12, 12, 20, calc(.72 * var(--bga))));
    box-shadow: 0 -8px 30px rgba(0, 0, 0, .35);
  }
  html[data-style="bar"][data-pos^="t"] .card { top: 0; bottom: auto; border-width: 0 0 1px; --ty: -100%; }
  html[data-style="bar"] .cover { width: 54px; height: 54px; border-radius: 8px; }
  html[data-style="bar"] .meta { flex-direction: row; align-items: baseline; gap: 12px; }
  html[data-style="bar"] .np { flex: none; font-size: 11px; }
  html[data-style="bar"] .title { font-size: 21px; flex: 0 1 auto; max-width: 62%; }
  html[data-style="bar"] .artist { font-size: 16px; flex: 0 1000 auto; }
  html[data-style="bar"] .artist:not(:empty)::before { content: "— "; color: rgba(255, 255, 255, .4); }
  html[data-style="bar"] .row { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; }
  html[data-style="bar"] .bar { height: 3px; border-radius: 0; background: rgba(255, 255, 255, .08); }
  html[data-style="bar"] .fill { border-radius: 0; }
  html[data-style="bar"] .time { position: absolute; right: 16px; bottom: 26px; font-size: 14px; }
  html[data-style="bar"] canvas.viz { left: auto; right: 0; width: 42%; height: 100%; opacity: .28; border-radius: 0; }

  /* ---------- motyw: duża okładka z napisem ---------- */
  html[data-style="cover"] .card { display: block; width: 300px; overflow: hidden; padding: 0; border-radius: 18px; overflow: hidden; }
  html[data-style="cover"] .cw { display: block; }
  html[data-style="cover"] .cover { display: block; width: 100%; height: 300px; border-radius: 0; box-shadow: none; }
  html[data-style="cover"] .meta {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; gap: 2px;
    padding: 56px 16px 14px; background: linear-gradient(transparent, rgba(0, 0, 0, .55) 35%, rgba(0, 0, 0, .9));
  }
  html[data-style="cover"] .np { font-size: 10px; }
  html[data-style="cover"] .title { font-size: 20px; }
  html[data-style="cover"] .artist { font-size: 14px; }
  html[data-style="cover"] .bar { height: 4px; }
  html[data-style="cover"] .time { font-size: 12px; }
  html[data-style="cover"] canvas.viz { left: 0; right: 0; top: 0; bottom: auto; width: 100%; height: 46px; z-index: 1; opacity: .5; transform: scaleY(-1); border-radius: 0; }

  /* ---------- motyw: minimalny (sam tekst) ---------- */
  html[data-style="minimal"] .card { width: auto; max-width: calc(100vw - 48px); background: none; border: 0; box-shadow: none; padding: 0; gap: 14px; }
  html[data-style="minimal"] .cover { width: 64px; height: 64px; border-radius: 10px; }
  html[data-style="minimal"] .np, html[data-style="minimal"] .time, html[data-style="minimal"] canvas.viz { display: none; }
  html[data-style="minimal"] .title { font-size: 26px; text-shadow: 0 2px 8px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .9); }
  html[data-style="minimal"] .artist { font-size: 17px; color: rgba(255, 255, 255, .85); text-shadow: 0 2px 6px rgba(0, 0, 0, .85); }
  html[data-style="minimal"] .row { margin-top: 4px; }
  html[data-style="minimal"] .bgart { display: none; }
  html[data-style="minimal"] .bar { height: 3px; background: rgba(255, 255, 255, .22); }

  /* ---------- motyw: winyl (obracająca się płyta) ---------- */
  html[data-style="vinyl"] .card { width: min(640px, calc(100vw - 2 * var(--m))); gap: 20px; padding: 12px 30px 12px 12px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(10, 10, 14, calc(.86 * var(--bga))), rgba(10, 10, 14, calc(.66 * var(--bga)))); border-color: rgba(255, 255, 255, calc(.12 * var(--bga) + .04)); box-shadow: 0 10px 34px rgba(0, 0, 0, calc(.45 * var(--bga))); }
  html[data-style="vinyl"] .cw { width: 108px; height: 108px; border-radius: 50%; background: #0b0b0e; box-shadow: 0 8px 24px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .06);
    animation: pulsarSpin 7s linear infinite; animation-play-state: paused; }
  html[data-style="vinyl"][data-playing="1"] .cw { animation-play-state: running; }
  html[data-style="vinyl"] .cover { width: 100%; height: 100%; border-radius: 50%; box-shadow: none;
    -webkit-mask-image: radial-gradient(circle, transparent 9%, #000 9.5%, #000 36%, transparent 36.5%, transparent 38%, #000 38.5%);
    mask-image: radial-gradient(circle, transparent 9%, #000 9.5%, #000 36%, transparent 36.5%, transparent 38%, #000 38.5%); }
  html[data-style="vinyl"] .cw::before { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; z-index: 1;
    background: repeating-radial-gradient(circle, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, .28) 2px 3px), radial-gradient(circle, transparent 36%, rgba(0, 0, 0, .55) 37%, rgba(0, 0, 0, .35) 100%);
    -webkit-mask-image: radial-gradient(circle, transparent 36.5%, #000 37%); mask-image: radial-gradient(circle, transparent 36.5%, #000 37%); }
  html[data-style="vinyl"] .cw::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; z-index: 2;
    background: #0b0b0e; box-shadow: 0 0 0 3px rgba(var(--acc), .9); }
  html[data-style="vinyl"] .title { font-size: 24px; }
  html[data-style="vinyl"] canvas.viz { left: 140px; right: 34px; width: calc(100% - 174px); height: 30px; opacity: .45; border-radius: 0; }
  html[data-style="vinyl"][data-cover="0"] .card { padding-left: 30px; }
  html[data-style="vinyl"][data-cover="0"] canvas.viz { left: 30px; width: calc(100% - 64px); }
  @keyframes pulsarSpin { to { transform: rotate(360deg); } }

  /* ---------- motyw: neon ---------- */
  html[data-style="neon"] .card { width: min(680px, calc(100vw - 2 * var(--m))); border-radius: 14px; border: 2px solid rgba(var(--acc), 1);
    background: rgba(6, 4, 12, calc(.6 * var(--bga)));
    box-shadow: 0 0 8px rgba(var(--acc), .9), 0 0 28px rgba(var(--acc), .45), inset 0 0 22px rgba(var(--acc), .3); }
  html[data-style="neon"] .cover { width: 96px; height: 96px; border-radius: 8px; box-shadow: 0 0 0 2px rgba(var(--acc), 1), 0 0 22px rgba(var(--acc), .7); }
  html[data-style="neon"] .np { color: #fff; text-shadow: 0 0 6px rgba(var(--acc), 1), 0 0 14px rgba(var(--acc), .8); filter: none; animation: pulsarFlicker 5s infinite; }
  html[data-style="neon"] .title { text-transform: uppercase; letter-spacing: 1px; font-size: 25px; font-weight: 700;
    text-shadow: 0 0 4px #fff, 0 0 10px rgba(var(--acc), 1), 0 0 24px rgba(var(--acc), .9), 0 0 42px rgba(var(--acc), .6); }
  html[data-style="neon"] .artist { color: rgba(var(--acc), 1); filter: brightness(1.5); text-shadow: 0 0 10px rgba(var(--acc), .8); }
  html[data-style="neon"] .bar { height: 3px; background: rgba(var(--acc), .18); overflow: visible; }
  html[data-style="neon"] .fill { background: #fff; box-shadow: 0 0 6px #fff, 0 0 12px rgba(var(--acc), 1), 0 0 24px rgba(var(--acc), 1); }
  html[data-style="neon"] .time { color: rgba(var(--acc), 1); filter: brightness(1.5); text-shadow: 0 0 8px rgba(var(--acc), .9); }
  html[data-style="neon"] canvas.viz { opacity: .75; filter: drop-shadow(0 0 4px rgba(var(--acc), 1)); left: 132px; width: calc(100% - 132px); }
  @keyframes pulsarFlicker { 0%, 91%, 95%, 100% { opacity: 1; } 92% { opacity: .35; } 93.5% { opacity: .9; } 94% { opacity: .4; } }

  /* ---------- motyw: pastylka (mała, do rogu ekranu) ---------- */
  html[data-style="pill"] .card { width: auto; max-width: min(560px, calc(100vw - 2 * var(--m))); grid-template-columns: auto minmax(0, 1fr); gap: 11px;
    padding: 6px 22px 6px 6px; border-radius: 999px; background: rgba(16, 16, 24, calc(.88 * var(--bga))); border-color: rgba(255, 255, 255, calc(.14 * var(--bga) + .04));
    box-shadow: 0 8px 26px rgba(0, 0, 0, calc(.4 * var(--bga))); overflow: hidden; }
  html[data-style="pill"] .cover { width: 42px; height: 42px; border-radius: 50%; box-shadow: none; }
  html[data-style="pill"] .meta { flex-direction: row; align-items: baseline; gap: 8px; }
  html[data-style="pill"] .np, html[data-style="pill"] .time, html[data-style="pill"] canvas.viz { display: none; }
  html[data-style="pill"] .title { font-size: 16px; font-weight: 700; flex: 0 1 auto; max-width: 68%; text-shadow: none; }
  html[data-style="pill"] .artist { font-size: 14px; flex: 0 1000 auto; color: rgba(255, 255, 255, .62); }
  html[data-style="pill"] .artist:not(:empty)::before { content: "· "; color: rgba(255, 255, 255, .35); }
  html[data-style="pill"] .row { position: absolute; left: 60px; right: 22px; bottom: 5px; margin: 0; }
  html[data-style="pill"] .bar { height: 2px; background: rgba(255, 255, 255, .1); }
  html[data-style="pill"] .fill { box-shadow: none; }
  html[data-style="pill"][data-cover="0"] .card { padding-left: 22px; }
  html[data-style="pill"][data-cover="0"] .row { left: 22px; }

  /* ---------- opcje wspólne: kolor tekstu, wielkość tytułu, rogi, kształt okładki ---------- */
  .title { zoom: var(--ts, 1); }
  html[data-tcol="1"] .title { color: rgb(var(--txt)) !important; }
  html[data-tcol="1"] .artist, html[data-tcol="1"] .time { color: rgba(var(--txt), .72) !important; }
  html[data-rad="1"] .card { border-radius: var(--r) !important; }
  html[data-rad="1"]:not([data-style="vinyl"]):not([data-style="cover"]):not([data-style="pill"]) .cover { border-radius: min(var(--r), 16px); }
  html[data-cshape="square"]:not([data-style="vinyl"]) .cover { border-radius: 0 !important; }
  html[data-cshape="rounded"]:not([data-style="vinyl"]) .cover { border-radius: 14px !important; }
  html[data-cshape="circle"]:not([data-style="vinyl"]):not([data-style="cover"]) .cover { border-radius: 50% !important; }

  /* ---------- motyw: szkło (jasna, półprzezroczysta tafla) ---------- */
  html[data-style="glass"] .card { width: min(680px, calc(100vw - 2 * var(--m))); border-radius: 26px; padding: 14px 22px 14px 14px;
    background: linear-gradient(135deg, rgba(255, 255, 255, calc(.24 * var(--bga))), rgba(255, 255, 255, calc(.08 * var(--bga))));
    border: 1px solid rgba(255, 255, 255, calc(.4 * var(--bga) + .08));
    box-shadow: 0 20px 50px rgba(0, 0, 0, calc(.3 * var(--bga))), inset 0 1px 0 rgba(255, 255, 255, .5), inset 0 -1px 0 rgba(255, 255, 255, .08);
    -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5); }
  html[data-style="glass"] .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(165deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 38%); }
  html[data-style="glass"] .cover { border-radius: 18px; box-shadow: 0 10px 26px rgba(0, 0, 0, .3), 0 0 0 1px rgba(255, 255, 255, .35); }
  html[data-style="glass"] .np { color: rgba(255, 255, 255, .85); filter: none; }
  html[data-style="glass"] .title { text-shadow: 0 1px 14px rgba(0, 0, 0, .35); }
  html[data-style="glass"] .artist { color: rgba(255, 255, 255, .85); text-shadow: 0 1px 8px rgba(0, 0, 0, .3); }
  html[data-style="glass"] .bar { background: rgba(255, 255, 255, .25); }
  html[data-style="glass"] .fill { background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .7); }
  html[data-style="glass"] .time { color: rgba(255, 255, 255, .85); }
  html[data-style="glass"] canvas.viz { opacity: .4; border-radius: 0 0 26px 0; }
  html[data-style="glass"] body, html[data-style="glass"] { --vc: 255, 255, 255; }

  /* ---------- motyw: terminal (retro konsola) ---------- */
  html[data-style="terminal"] body { --tc: 90, 255, 130; --vc: var(--tc); }
  html[data-style="terminal"][data-customacc="1"] body { --tc: var(--acc); }
  html[data-style="terminal"] .card { width: min(680px, calc(100vw - 2 * var(--m))); border-radius: 6px; padding: 14px 20px 14px 14px; gap: 16px;
    font-family: "Cascadia Mono", Consolas, "DejaVu Sans Mono", "Courier New", monospace;
    background: rgba(3, 8, 4, calc(.92 * var(--bga))); border: 1px solid rgba(var(--tc), .5);
    box-shadow: 0 0 26px rgba(var(--tc), .16), inset 0 0 44px rgba(var(--tc), .07); }
  html[data-style="terminal"] .card::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3;
    background: repeating-linear-gradient(180deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, .22) 2px 3px); }
  html[data-style="terminal"] .cw::after { content: ""; position: absolute; inset: 0; border-radius: 2px; background: rgba(var(--tc), .6); mix-blend-mode: multiply; }
  html[data-style="terminal"] .cover { width: 86px; height: 86px; border-radius: 2px; filter: grayscale(1) contrast(1.25) brightness(1.1); box-shadow: 0 0 0 1px rgba(var(--tc), .7), 0 0 16px rgba(var(--tc), .35); }
  html[data-style="terminal"] .np { color: rgb(var(--tc)); filter: none; letter-spacing: 1px; font-weight: 400; text-transform: lowercase; }
  html[data-style="terminal"] .np::before { content: "pulsar:~$ "; opacity: .7; text-transform: none; }
  html[data-style="terminal"] .title { color: rgb(var(--tc)); font-size: 23px; font-weight: 700; letter-spacing: -.02em; text-shadow: 0 0 8px rgba(var(--tc), .75); }
  html[data-style="terminal"] .artist { color: rgba(var(--tc), .78); font-size: 15px; }
  html[data-style="terminal"] .artist::after { content: "\2588"; margin-left: 4px; animation: pulsarBlink 1s steps(1) infinite; color: rgb(var(--tc)); }
  html[data-style="terminal"] .bar { height: 10px; border-radius: 0; background: rgba(var(--tc), .1); box-shadow: inset 0 0 0 1px rgba(var(--tc), .45); }
  html[data-style="terminal"] .fill { border-radius: 0; background: repeating-linear-gradient(90deg, rgb(var(--tc)) 0 6px, transparent 6px 8px); box-shadow: 0 0 8px rgba(var(--tc), .6); }
  html[data-style="terminal"] .time { color: rgb(var(--tc)); }
  html[data-style="terminal"] canvas.viz { left: 116px; width: calc(100% - 116px); opacity: .35; border-radius: 0; }
  @keyframes pulsarBlink { 50% { opacity: 0; } }

  /* ---------- motyw: belka TV (lower third) ---------- */
  html[data-style="tv"] .card { width: auto; max-width: min(760px, calc(100vw - 2 * var(--m))); min-width: 360px; gap: 0; padding: 0; border: 0; border-radius: 3px; overflow: hidden;
    background: rgba(250, 250, 252, calc(.96 * var(--bga))); color: #111; box-shadow: 0 12px 34px rgba(0, 0, 0, .4); }
  html[data-style="tv"] .cw { align-self: stretch; display: grid; place-items: center; padding: 10px; background: rgb(var(--acc)); }
  html[data-style="tv"] .cover { width: 70px; height: 70px; border-radius: 2px; box-shadow: 0 4px 12px rgba(0, 0, 0, .3); }
  html[data-style="tv"] .meta { padding: 10px 24px 12px 18px; gap: 3px; }
  html[data-style="tv"] .np { align-self: flex-start; background: rgb(var(--acc)); color: #fff; filter: none; font-size: 10.5px; padding: 2px 8px; border-radius: 2px; letter-spacing: 1.2px; }
  html[data-style="tv"] .title { color: #111; text-shadow: none; font-size: 24px; }
  html[data-style="tv"] .artist { color: #4a4a55; font-size: 15px; }
  html[data-style="tv"] .row { margin-top: 4px; }
  html[data-style="tv"] .bar { height: 4px; background: rgba(0, 0, 0, .1); }
  html[data-style="tv"] .fill { background: rgb(var(--acc)); box-shadow: none; }
  html[data-style="tv"] .time { color: #555; font-size: 12px; }
  html[data-style="tv"] canvas.viz { left: auto; right: 0; width: 45%; height: 26px; opacity: .22; border-radius: 0; }
  html[data-style="tv"] .bgart { filter: blur(26px) saturate(1.2) brightness(1.6); opacity: calc(.5 * var(--bga)); }
  html[data-style="tv"][data-anim="slide"] .card { --ty: 0px; clip-path: inset(0 100% 0 0); transition: opacity .3s ease, clip-path .7s cubic-bezier(.7, 0, .2, 1); }
  html[data-style="tv"][data-anim="slide"] .card.show { clip-path: inset(0 0 0 0); }
  html[data-style="tv"][data-anim="slide"] .card.idle, html[data-style="tv"][data-anim="slide"] .card.show.ah { clip-path: inset(0 100% 0 0); }
  html[data-style="tv"][data-pos$="r"][data-anim="slide"] .card.idle, html[data-style="tv"][data-pos$="r"][data-anim="slide"] .card.show.ah { clip-path: inset(0 0 0 100%); }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="bgart" id="bgart"></div>
    <div class="cw"><img class="cover" id="cover" alt=""></div>
    <div class="meta">
      <div class="np" id="np">Teraz gra</div>
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="row"><div class="bar"><div class="fill" id="fill"></div></div><div class="time" id="time"></div></div>
    </div>
    <canvas class="viz" id="viz"></canvas>
  </div>
<script>
(function () {
  'use strict';
  var MODE = document.documentElement.getAttribute('data-mode') || 'overlay';
  var PREVIEW = /[?&]preview\b/.test(location.search); // podgląd w ustawieniach Pulsara — dane przez postMessage, bez połączenia
  var themeAccent = ''; // własny kolor akcentu z motywu ('' = z okładki)
  var BAKED_THEME = /*PULSAR_THEME*/null; // motyw zapisany przez Pulsara w pliku dla OBS (działa od razu, jeszcze przed połączeniem)
  var vizStyle = 'bars', autoHide = 0, changedAt = performance.now(), marquee = false, curTitle = '';
  var TARGET = 0.12;   // docelowy bufor [s] — małe opóźnienie względem Pulsara
  var MAX_LEAD = 0.3;  // powyżej tego nadmiarowe paczki są odrzucane
  var ctx = null, outGain = null, analyser = null, nextTime = 0, lastSeq = -1, lastAudioAt = 0;
  var ws = null, retryTimer = 0, connectedAt = 0, lastNow = -1, lastArrive = 0;
  var meta = { playing: false, pos: 0, dur: 0, at: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var LABELS = { pl: 'Teraz gra', en: 'Now playing', es: 'Sonando ahora' };

  window.__pulsarObs = { stats: { chunks: 0, dropped: 0, resets: 0, lead: 0 }, meta: meta, connected: false };
  var stats = window.__pulsarObs.stats;

  /* ---------- połączenie z Pulsarem ---------- */
  function loadConnection(cb) {
    // connection.js jest nadpisywany przy każdym starcie Pulsara (nowy token) — wczytujemy go na świeżo
    var old = document.getElementById('pulsarConn');
    if (old) old.parentNode.removeChild(old);
    var s = document.createElement('script');
    s.id = 'pulsarConn';
    s.src = 'connection.js?t=' + Date.now();
    s.onload = function () { cb(window.PULSAR_OBS || null); };
    s.onerror = function () { cb(null); };
    document.head.appendChild(s);
  }
  function scheduleRetry(ms) {
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, ms || 2000);
  }
  function connect() {
    loadConnection(function (c) {
      if (!c || !c.port || !c.connectToken) { scheduleRetry(2000); return; }
      try {
        ws = new WebSocket('ws://127.0.0.1:' + c.port + '/?connectToken=' + encodeURIComponent(c.connectToken));
      } catch (e) { scheduleRetry(2000); return; }
      ws.onopen = function () { connectedAt = Date.now(); window.__pulsarObs.connected = true; };
      ws.onclose = function () { window.__pulsarObs.connected = false; ws = null; scheduleRetry(1500); };
      ws.onerror = function () { try { ws.close(); } catch (e) {} };
      ws.onmessage = function (ev) {
        var msg;
        if (typeof ev.data !== 'string' || ev.data.indexOf('"pulsarObs') < 0) return; // ignoruj inne zdarzenia Neutralino
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (!msg || !msg.event) return;
        if (msg.event === 'pulsarObsAudio') onAudio(msg.data);
        else if (msg.event === 'pulsarObsMeta') onMeta(msg.data);
        else if (msg.event === 'pulsarObsCover') onCover(msg.data);
      };
    });
  }

  /* ---------- dźwięk ---------- */
  function ensureCtx(sr) {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    try { ctx = new AC({ latencyHint: 'playback', sampleRate: sr }); } catch (e) { ctx = new AC(); }
    outGain = ctx.createGain();
    analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.75;
    outGain.connect(analyser); analyser.connect(ctx.destination);
  }
  function b64ToInt16(b64) {
    var bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return new Int16Array(u8.buffer, 0, n >> 1);
  }
  function onAudio(d) {
    if (!d || !d.pcm) return;
    var sr = d.sr || 48000, ch = d.ch || 2;
    ensureCtx(sr);
    var pcm = b64ToInt16(d.pcm), frames = (pcm.length / ch) | 0;
    if (!frames) return;
    var buf = ctx.createBuffer(ch, frames, sr);
    for (var c = 0; c < ch; c++) {
      var out = buf.getChannelData(c);
      for (var i = 0, j = c; i < frames; i++, j += ch) out[i] = pcm[j] / 32768;
    }
    if (ctx.state !== 'running') return; // kontekst jeszcze startuje — zegar stoi, nie ma sensu kolejkować
    var now = ctx.currentTime, tNow = performance.now();
    // zegar audio stoi mimo stanu „running” (urządzenie jeszcze się otwiera) → nie kolejkuj, bo bufor tylko by puchł
    var stalled = now === lastNow && tNow - lastArrive > 25;
    lastArrive = tNow;
    if (stalled) { stats.stalled = (stats.stalled || 0) + 1; lastSeq = -1; return; }
    lastNow = now;
    // przerwa w dostawie (pauza, zmiana utworu) lub start → ustaw bufor od nowa
    if (lastSeq < 0 || d.seq !== lastSeq + 1 || nextTime < now + 0.02) { nextTime = now + TARGET; if (lastSeq >= 0) stats.resets++; }
    lastSeq = d.seq;
    var lead = nextTime - now;
    // za duży zapas (seria zaległych paczek po chwilowym zablokowaniu strony) → odrzuć nadmiar, żeby nie rosło opóźnienie
    if (lead > MAX_LEAD) { stats.dropped++; return; }
    // łagodna korekta dryfu zegarów (maks. ±0,5% ≈ 9 centów — niesłyszalne), zamiast skoków
    var rate = 1 + Math.max(-0.005, Math.min(0.005, (lead - TARGET) * 0.05));
    var src = ctx.createBufferSource();
    src.buffer = buf; src.playbackRate.value = rate;
    src.connect(outGain);
    src.start(nextTime);
    nextTime += buf.duration / rate;
    stats.chunks++; stats.lead = Math.round(lead * 1000); stats.state = ctx.state; stats.ctxTime = Math.round(now * 1000);
    lastAudioAt = Date.now();
  }

  /* ---------- metadane / overlay ---------- */
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function onMeta(m) {
    if (!m) return;
    meta.playing = !!m.playing; meta.pos = +m.pos || 0; meta.dur = +m.dur || 0; meta.at = performance.now();
    if (m.lang && LABELS[m.lang]) $('np').textContent = LABELS[m.lang];
    if (m.title != null && curTitle !== m.title) { setTitle(m.title); changedAt = performance.now(); }
    if (m.playing && !meta.wasPlaying) changedAt = performance.now(); // wznowienie po pauzie → pokaż znowu (auto-chowanie)
    meta.wasPlaying = !!m.playing;
    document.documentElement.setAttribute('data-playing', m.playing ? '1' : '0');
    if (m.artist != null && $('artist').textContent !== m.artist) $('artist').textContent = m.artist;
    if (m.theme) applyTheme(m.theme);
    var acc = themeAccent || m.accent;
    if (acc) document.body.style.setProperty('--acc', acc);
    if (!m.coverId) { $('cover').removeAttribute('src'); $('cover').dataset.id = ''; $('bgart').style.backgroundImage = ''; }
    var card = $('card');
    if (m.title) card.classList.add('show');
    card.classList.toggle('idle', !m.hasTrack || m.hidden === true);
  }
  function setTitle(t) {
    curTitle = t; var el = $('title');
    el.classList.remove('mq'); el.textContent = t;
    if (!marquee || !t) return;
    // tylko gdy się nie mieści — mierzymy po ułożeniu
    requestAnimationFrame(function () {
      if (curTitle !== t || el.scrollWidth <= el.clientWidth + 2) return;
      var sp = document.createElement('span'); sp.className = 'mq-in';
      sp.textContent = t + '\u2003\u2003\u2003' + t + '\u2003\u2003\u2003';
      el.textContent = ''; el.appendChild(sp); el.classList.add('mq');
      el.style.setProperty('--mqd', Math.max(8, t.length * 0.32) + 's');
    });
  }
  function num(v, lo, hi, def) { v = Number(v); return isFinite(v) ? Math.max(lo, Math.min(hi, v)) : def; }
  function applyTheme(th) {
    var root = document.documentElement;
    var st = { card: 1, bar: 1, cover: 1, minimal: 1, vinyl: 1, neon: 1, pill: 1, glass: 1, terminal: 1, tv: 1 }[th.style] ? th.style : 'card';
    var ps = { bl: 1, br: 1, tl: 1, tr: 1, bc: 1 }[th.pos] ? th.pos : 'bl';
    if (root.getAttribute('data-style') !== st) root.setAttribute('data-style', st);
    if (root.getAttribute('data-pos') !== ps) root.setAttribute('data-pos', ps);
    root.setAttribute('data-viz', th.viz === false ? '0' : '1');
    themeAccent = /^\d{1,3}, ?\d{1,3}, ?\d{1,3}$/.test(String(th.accent || '')) ? th.accent : '';
    var b = document.body.style;
    b.setProperty('--s', String(num(th.scale, 50, 200, 100) / 100));
    b.setProperty('--bga', String(num(th.bg, 0, 100, 100) / 100));
    b.setProperty('--m', num(th.margin, 0, 120, 24) + 'px');
    root.setAttribute('data-font', { sans: 1, condensed: 1, serif: 1, mono: 1 }[th.font] ? th.font : 'sans');
    root.setAttribute('data-anim', { slide: 1, fade: 1, zoom: 1, none: 1 }[th.anim] ? th.anim : 'slide');
    root.setAttribute('data-cover', th.cover === false ? '0' : '1');
    root.setAttribute('data-prog', th.progress === false ? '0' : '1');
    root.setAttribute('data-label', th.label === false ? '0' : '1');
    root.setAttribute('data-art', th.art ? '1' : '0');
    root.setAttribute('data-customacc', themeAccent ? '1' : '0');
    var rgb = /^\d{1,3}, ?\d{1,3}, ?\d{1,3}$/;
    if (rgb.test(String(th.text || ''))) { b.setProperty('--txt', th.text); root.setAttribute('data-tcol', '1'); } else root.setAttribute('data-tcol', '0');
    b.setProperty('--ts', String(num(th.tsize, 50, 200, 100) / 100));
    var rad = num(th.radius, -1, 999, -1);
    root.setAttribute('data-rad', rad >= 0 ? '1' : '0'); b.setProperty('--r', Math.max(0, rad) + 'px');
    root.setAttribute('data-cshape', { square: 1, rounded: 1, circle: 1 }[th.cshape] ? th.cshape : 'auto');
    vizStyle = { bars: 1, wave: 1, mirror: 1 }[th.vizStyle] ? th.vizStyle : 'bars';
    autoHide = PREVIEW ? 0 : num(th.autohide, 0, 600, 0);
    var mq = !!th.marquee;
    if (mq !== marquee) { marquee = mq; setTitle(curTitle); }
  }
  function onCover(c) {
    if (!c) return;
    var img = $('cover');
    if (img.dataset.id === c.id) return;
    img.dataset.id = c.id || '';
    if (c.data) img.src = c.data; else img.removeAttribute('src');
    $('bgart').style.backgroundImage = c.data ? 'url("' + c.data + '")' : '';
  }
  function tick() {
    requestAnimationFrame(tick);
    if (MODE !== 'overlay') return;
    var pos = meta.pos + (meta.playing ? (performance.now() - meta.at) / 1000 : 0);
    if (meta.dur) pos = Math.min(pos, meta.dur);
    $('fill').style.width = (meta.dur ? (pos / meta.dur) * 100 : 0) + '%';
    $('time').textContent = meta.dur ? fmt(pos) + ' / ' + fmt(meta.dur) : '';
    $('card').classList.toggle('ah', autoHide > 0 && performance.now() - changedAt > autoHide * 1000);
    drawViz();
  }
  var vizData = null;
  function drawViz() {
    var cv = $('viz'); if (!cv) return;
    var w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    var dpr = window.devicePixelRatio || 1;
    if (cv.width !== (w * dpr | 0)) { cv.width = w * dpr | 0; cv.height = h * dpr | 0; }
    var g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    if (!analyser || Date.now() - lastAudioAt > 400) return;
    if (!vizData) vizData = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(vizData);
    var cs = getComputedStyle(document.body);
    var acc = cs.getPropertyValue('--vc').trim() || cs.getPropertyValue('--acc').trim() || '160,107,255';
    var bars = 48, bw = cv.width / bars, H = cv.height, vals = [];
    for (var i = 0; i < bars; i++) {
      var v = vizData[Math.min(vizData.length - 1, Math.floor(Math.pow(i / bars, 1.6) * vizData.length * 0.9))] / 255;
      vals.push(v * v);
    }
    g.fillStyle = 'rgba(' + acc + ',0.9)';
    if (vizStyle === 'wave') {
      // gładka fala (wypełniona) — krzywe przez środki słupków
      g.beginPath(); g.moveTo(0, H);
      var px = 0, py = H - Math.max(1, vals[0] * H);
      g.lineTo(0, py);
      for (var k = 1; k < bars; k++) {
        var x = k * bw + bw / 2, y = H - Math.max(1, vals[k] * H);
        g.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2); px = x; py = y;
      }
      g.lineTo(cv.width, py); g.lineTo(cv.width, H); g.closePath();
      var grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, 'rgba(' + acc + ',0.95)'); grd.addColorStop(1, 'rgba(' + acc + ',0.15)');
      g.fillStyle = grd; g.fill();
    } else if (vizStyle === 'mirror') {
      // słupki symetryczne względem środka, zaokrąglone
      for (var m = 0; m < bars; m++) {
        var bh2 = Math.max(2, vals[m] * H);
        var w2 = Math.max(1, bw - 3), x2 = m * bw + 1.5, y2 = (H - bh2) / 2, r2 = Math.min(w2 / 2, bh2 / 2);
        g.beginPath();
        if (g.roundRect) g.roundRect(x2, y2, w2, bh2, r2); else g.rect(x2, y2, w2, bh2);
        g.fill();
      }
    } else {
      for (var j = 0; j < bars; j++) {
        var bh = Math.max(1, vals[j] * H);
        g.fillRect(j * bw + 1, H - bh, bw - 2, bh);
      }
    }
  }

  // OBS pozwala na autoodtwarzanie; w zwykłej przeglądarce kontekst audio ruszy po kliknięciu
  document.addEventListener('click', function () { if (ctx && ctx.state === 'suspended') ctx.resume(); });
  if (BAKED_THEME) applyTheme(BAKED_THEME);
  requestAnimationFrame(tick);
  if (PREVIEW) {
    // tło „przezroczystości” rysuje sam podgląd (ramka w oknie Pulsara nie zawsze jest przezroczysta)
    document.documentElement.style.background = 'repeating-conic-gradient(#2a2a30 0 25%, #1e1e24 0 50%) 0 0 / 40px 40px';
    // podgląd: dane z okna Pulsara; sztuczny analizator nie jest potrzebny — rysujemy „udawane” słupki
    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.pulsarObsPreview) { onMeta(d.pulsarObsPreview); if (d.cover !== undefined) onCover({ id: 'p' + (d.cover || '').length + (d.cover || '').slice(-24), data: d.cover }); }
    });
    analyser = { frequencyBinCount: 128, getByteFrequencyData: function (a) { var t = performance.now() / 1000; for (var i = 0; i < a.length; i++) a[i] = 150 + 90 * Math.sin(t * 3 + i * 0.35) * Math.cos(t * 1.3 + i * 0.11); } };
    setInterval(function () { lastAudioAt = Date.now(); }, 200);
    try { parent.postMessage({ pulsarObsPreviewReady: true }, '*'); } catch (e) {}
  } else connect();
})();
</script>
</body>
